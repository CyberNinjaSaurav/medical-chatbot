<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chat-card">
        <div class="chat-header">
            <img src="{{ url_for('static', filename='bot.png') }}" class="user-img" onerror="this.style.display='none'">
            <div class="user-info">
                <span>Medical Chatbot</span>
                <p>Ask me anything!</p>
            </div>
        </div>
        <div id="message-container" class="message-container">
            <div class="message bot-message">
                Hello! I'm a medical chatbot. I can answer your questions based on the provided documents. Please remember I am not a substitute for professional medical advice.
            </div>
        </div>
        <div class="input-form">
            <form id="message-area" class="message-area">
                <input type="text" id="text-input" name="msg" placeholder="Type your message..." autocomplete="off" class="input-text" />
                <button type="submit" id="send-btn" class="send-btn">
                    Send
                </button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const chatbox = document.getElementById("message-container");
            const form = document.getElementById("message-area");
            const input = document.getElementById("text-input");
            const sendBtn = document.getElementById("send-btn");
            const spinnerHtml = '<div class="spinner"></div>';

            function addMessage(sender, text, time) {
                const isUser = sender === "user";
                const messageClass = isUser ? "user-message" : "bot-message";

                const wrapper = document.createElement("div");
                wrapper.className = "message " + messageClass + " fade-in";
                wrapper.textContent = text;

                const timeDiv = document.createElement("div");
                timeDiv.className = "message-time";
                timeDiv.textContent = time;
                wrapper.appendChild(timeDiv);

                chatbox.appendChild(wrapper);
                chatbox.scrollTop = chatbox.scrollHeight;
            }

            form.addEventListener("submit", function (event) {
                event.preventDefault();
                const rawText = input.value;
                if (rawText.trim() === "") return;

                const date = new Date();
                const time = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                addMessage("user", rawText, time);
                input.value = "";
                sendBtn.innerHTML = spinnerHtml;
                sendBtn.disabled = true;

                fetch("/get", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
                    body: new URLSearchParams({ msg: rawText })
                })
                .then(function (res) {
                    if (!res.ok) throw new Error("Request failed");
                    return res.text();
                })
                .then(function (data) {
                    addMessage("bot", data, time);
                })
                .catch(function () {
                    addMessage("bot", "Oops! Something went wrong. Please try again.", time);
                })
                .finally(function () {
                    sendBtn.textContent = "Send";
                    sendBtn.disabled = false;
                });
            });
        });
    </script>
</body>
</html>
